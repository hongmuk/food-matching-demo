<title>관리자 웹 데모</title>
<style>
html,body{height:100%}
body{margin:0; display:grid; place-items:center; background:#17382B; color:#15201B; font:15px/1.5 "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
form{width:min(340px, calc(100vw - 40px)); padding:28px 24px 24px; border-radius:20px; background:#fff}
h1{margin:0 0 6px; font-size:20px; letter-spacing:-.02em}
p{margin:0 0 18px; font-size:14px; color:#4A5850}
label{display:block; margin-bottom:6px; font-size:13px; font-weight:600}

button{width:100%; min-height:52px; margin-top:12px; border:0; border-radius:12px; background:#17382B; color:#fff; font:inherit; font-size:16px; font-weight:600; cursor:pointer}
button:disabled{opacity:.6}
.auto form{visibility:hidden}
#msg{min-height:20px; margin:10px 0 0; font-size:13px; font-weight:600; color:#D4472A}
</style>
</head>
<body>
<form id="gate">
  <h1>관리자 웹 데모</h1>
  <p>초대받은 분만 볼 수 있습니다. 전달받은 비밀번호를 입력해 주세요.</p>
  <label for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <button>열기</button>
  <p id="msg" role="alert"></p>
</form>

const raw = Uint8Array.from(atob(DATA), c => c.charCodeAt(0));
async function show(key) {
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(16, 28) }, key, raw.slice(28)));
  document.open(); document.write(html); document.close();
}
const importKey = bytes => crypto.subtle.importKey('raw', bytes, 'AES-GCM', true, ['decrypt']);
async function fromPassword(pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: raw.slice(0, 16), iterations: ITER, hash: 'SHA-256' }, km, 256));
}
// 저장된 열쇠가 있으면 바로 연다. 이 문서를 다 읽은 뒤에 바꿔 넣어야 문 화면의 스타일과 폼이 앱에 섞이지 않는다
let saved = null;
try { saved = localStorage.getItem(KEEP); } catch (e) { /* 저장이 막힌 브라우저 */ }
if (saved) document.documentElement.classList.add('auto');
window.addEventListener('load', async () => {
  if (!saved) return;
  try { await show(await importKey(Uint8Array.from(atob(saved), c => c.charCodeAt(0)))); }
  catch (e) { try { localStorage.removeItem(KEEP); } catch (e2) { /* 저장이 막힌 브라우저 */ } document.documentElement.classList.remove('auto'); }
});
document.getElementById('gate').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button'), msg = document.getElementById('msg');
  btn.disabled = true; msg.textContent = '';
  try {
    const bytes = await fromPassword(document.getElementById('pw').value);
    const key = await importKey(bytes);
    try { localStorage.setItem(KEEP, btoa(String.fromCharCode(...bytes))); } catch (e2) { /* 저장이 막혀도 이번에는 열린다 */ }
    await show(key);
  } catch (err) {
    try { localStorage.removeItem(KEEP); } catch (e2) { /* 저장이 막힌 브라우저 */ }
    msg.textContent = '비밀번호가 맞지 않습니다.'; btn.disabled = false;
  }
});
</script>
