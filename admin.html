  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(16, 28) }, key, raw.slice(28)));
  document.open(); document.write(html); document.close();
}
const importKey = bytes => crypto.subtle.importKey('raw', bytes, 'AES-GCM', true, ['decrypt']);
async function fromPassword(pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: raw.slice(0, 16), iterations: ITER, hash: 'SHA-256' }, km, 256));
}
(async () => {
  try { const saved = localStorage.getItem(KEEP); if (saved) await show(await importKey(Uint8Array.from(atob(saved), c => c.charCodeAt(0)))); }
  catch (e) { try { localStorage.removeItem(KEEP); } catch (e2) { /* 저장이 막힌 브라우저 */ } }
})();
document.getElementById('gate').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button'), msg = document.getElementById('msg');
  btn.disabled = true; msg.textContent = '';
  try {
    const bytes = await fromPassword(document.getElementById('pw').value);
    const key = await importKey(bytes);
    try { localStorage.setItem(KEEP, btoa(String.fromCharCode(...bytes))); } catch (e2) { /* 저장이 막혀도 이번에는 열린다 */ }
    await show(key);
  } catch (err) {
    try { localStorage.removeItem(KEEP); } catch (e2) { /* 저장이 막힌 브라우저 */ }
    msg.textContent = '비밀번호가 맞지 않습니다.'; btn.disabled = false;
  }
});
</script>
